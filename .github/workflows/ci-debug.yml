name: CI (Debug)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_webview2:
        description: Test isolated WebView2 windows (requires a usable Windows desktop)
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore .\BuffStrap.sln

      - name: Build
        run: dotnet build .\BuffStrap.sln -c Debug --no-restore

      - name: Test releases, favorites and backups
        run: dotnet run --project .\Tests\ReleaseClient.Tests\ReleaseClient.Tests.csproj -c Debug --no-build

      - name: Smoke test WPF pages and shortcuts
        timeout-minutes: ${{ inputs.test_webview2 && 2 || 3 }}
        env:
          BUFFSTRAP_TEST_WEBVIEW2: ${{ inputs.test_webview2 && '1' || '0' }}
        run: dotnet run --project .\Tests\UiSmoke.Tests\UiSmoke.Tests.csproj -c Debug --no-build
