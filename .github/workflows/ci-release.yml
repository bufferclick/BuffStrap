name: CI (Release)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$props = Get-Content BuffStrap.Version.props
          $version = [string]$props.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match BuffStrap.Version.props (v$version)."
          }

      - name: Restore
        run: dotnet restore .\BuffStrap.sln

      - name: Build
        run: dotnet build .\BuffStrap.sln -c Release --no-restore

      - name: Test releases, favorites and backups
        run: dotnet run --project .\Tests\ReleaseClient.Tests\ReleaseClient.Tests.csproj -c Release --no-build

      - name: Smoke test WPF pages and shortcuts
        timeout-minutes: 3
        run: dotnet run --project .\Tests\UiSmoke.Tests\UiSmoke.Tests.csproj -c Release --no-build

      - name: Publish BuffStrap
        run: dotnet publish .\Bloxstrap\Bloxstrap.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -o .\publish\app

      - name: Smoke-test the single-file WebView2 loader
        timeout-minutes: 3
        shell: pwsh
        run: |
          dotnet publish .\Tests\UiSmoke.Tests\UiSmoke.Tests.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish\ui-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BUFFSTRAP_TEST_WEBVIEW2_LOADER_ONLY = '1'
          $env:BUFFSTRAP_APP_BUNDLE = (Resolve-Path '.\publish\app\BuffStrap.exe').Path
          & .\publish\ui-smoke\UiSmoke.Tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish setup
        run: dotnet publish .\BuffStrapSetup\BuffStrapSetup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish\setup

      - name: Verify executable identities and prepare release files
        shell: pwsh
        run: |
          [xml]$props = Get-Content BuffStrap.Version.props
          $expectedVersion = [string]$props.Project.PropertyGroup.FileVersion
          foreach ($entry in @(
            @{ Path = '.\publish\app\BuffStrap.exe'; Product = 'BuffStrap' },
            @{ Path = '.\publish\setup\BuffStrapSetup.exe'; Product = 'BuffStrap Setup' }
          )) {
            $info = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $entry.Path).Path)
            if ($info.ProductName -cne $entry.Product -or $info.FileVersion -cne $expectedVersion) {
              throw "Unexpected identity for $($entry.Path): $($info.ProductName) $($info.FileVersion)."
            }
          }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item .\publish\app\BuffStrap.exe .\release\BuffStrap.exe
          Copy-Item .\publish\setup\BuffStrapSetup.exe .\release\BuffStrapSetup.exe

      - name: Upload Windows executables
        uses: actions/upload-artifact@v7
        with:
          name: buffstrap-windows-x64
          path: release/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: buffstrap-windows-x64
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: BuffStrap ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/BuffStrap.exe
            release/BuffStrapSetup.exe
