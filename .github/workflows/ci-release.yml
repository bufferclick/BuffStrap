name: CI (Release)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      # Stable tags are exactly vX.Y.Z. Pre-release test builds add -alpha.N or
      # -alpha.N.M to the same version (v1.0.3-alpha.1, v1.0.7-alpha.2.5) and are
      # never published as stable.
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$props = Get-Content BuffStrap.Version.props
          $version = [string]$props.Project.PropertyGroup.Version
          $tag = $env:GITHUB_REF_NAME
          $stable = '^v' + [regex]::Escape($version) + '$'
          $preview = '^v' + [regex]::Escape($version) + '-alpha\.[1-9][0-9]*(\.[0-9]+)*$'
          if ($tag -notmatch $stable -and $tag -notmatch $preview) {
            throw "Release tag $tag does not match BuffStrap.Version.props (v$version or v$version-alpha.N)."
          }

      - name: Restore
        run: dotnet restore .\BuffStrap.sln

      - name: Build
        run: dotnet build .\BuffStrap.sln -c Release --no-restore

      - name: Test releases, favorites and backups
        run: dotnet run --project .\Tests\ReleaseClient.Tests\ReleaseClient.Tests.csproj -c Release --no-build

      - name: Smoke test WPF pages, accounts and isolated browser profiles
        timeout-minutes: 3
        env:
          BUFFSTRAP_TEST_WEBVIEW2: '1'
        run: dotnet run --project .\Tests\UiSmoke.Tests\UiSmoke.Tests.csproj -c Release --no-build

      - name: Publish BuffStrap
        run: dotnet publish .\Bloxstrap\Bloxstrap.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -o .\publish\app

      - name: Smoke-test the single-file WebView2 loader
        timeout-minutes: 3
        shell: pwsh
        run: |
          dotnet publish .\Tests\UiSmoke.Tests\UiSmoke.Tests.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish\ui-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BUFFSTRAP_TEST_WEBVIEW2_LOADER_ONLY = '1'
          $env:BUFFSTRAP_APP_BUNDLE = (Resolve-Path '.\publish\app\BuffStrap.exe').Path
          & .\publish\ui-smoke\UiSmoke.Tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish setup
        run: dotnet publish .\BuffStrapSetup\BuffStrapSetup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish\setup

      - name: Verify executable identities and prepare release files
        shell: pwsh
        run: |
          [xml]$props = Get-Content BuffStrap.Version.props
          $expectedVersion = [string]$props.Project.PropertyGroup.FileVersion
          foreach ($entry in @(
            @{ Path = '.\publish\app\BuffStrap.exe'; Product = 'BuffStrap' },
            @{ Path = '.\publish\setup\BuffStrapSetup.exe'; Product = 'BuffStrap Setup' }
          )) {
            $info = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $entry.Path).Path)
            if ($info.ProductName -cne $entry.Product -or $info.FileVersion -cne $expectedVersion) {
              throw "Unexpected identity for $($entry.Path): $($info.ProductName) $($info.FileVersion)."
            }
          }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item .\publish\app\BuffStrap.exe .\release\BuffStrap.exe
          Copy-Item .\publish\setup\BuffStrapSetup.exe .\release\BuffStrapSetup.exe

      - name: Upload Windows executables
        uses: actions/upload-artifact@v7
        with:
          name: buffstrap-windows-x64
          path: release/
          if-no-files-found: error

      # A branch build is for the owner to test, not a published release. Keep
      # the app separate from setup, which installs the latest public release.
      - name: Upload test app
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: buffstrap-test-app
          path: release/BuffStrap.exe
          retention-days: 7
          if-no-files-found: error

  # Stable releases: tags that are exactly vX.Y.Z.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: buffstrap-windows-x64
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: BuffStrap ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/BuffStrap.exe
            release/BuffStrapSetup.exe

      # Community notification. The webhook lives in a repository secret so it is
      # never written into this public repository.
      - name: Notify Discord (stable)
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_STABLE_WEBHOOK }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_STABLE_WEBHOOK is not set; skipping the announcement."
            exit 0
          fi
          body=$(jq -n --arg url "https://github.com/bufferclick/BuffStrap/releases/tag/$TAG" --arg tag "$TAG"             '{username: "BuffStrap", content: ("**BuffStrap " + $tag + " is out.**\nDownload: " + $url + "\nOr use the site: https://buff.is-cool.dev")}')
          curl -sS -f -H "Content-Type: application/json" -d "$body" "$WEBHOOK"

  # Pre-release test builds: tags such as v1.0.3-alpha.1. The zip is deliberately
  # not named BuffStrap.exe, so setup and the auto-updater can never select it.
  preview:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-alpha.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: buffstrap-windows-x64
          path: release

      - name: Package the test build
        run: |
          cd release
          rm -f BuffStrapSetup.exe
          zip -q BuffStrap-alpha-win-x64.zip BuffStrap.exe
          unzip -l BuffStrap-alpha-win-x64.zip

      - name: Publish pre-release
        uses: softprops/action-gh-release@v3
        with:
          name: BuffStrap ${{ github.ref_name }} (pre-release)
          draft: false
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **Pre-release test build — not a normal release.**

            Download `BuffStrap-alpha-win-x64.zip`, unzip it to a folder you intend to keep, and run **BuffStrap.exe**.
            Do not use **BuffStrapSetup.exe**: setup and the automatic updater install the latest *stable*
            release only, and they never pick up pre-releases.

            This build may replace your existing BuffStrap installation, so back up your data first.
            The launch menu shows `(pre-release)` next to the version.
          files: |
            release/BuffStrap-alpha-win-x64.zip

      # Alpha testers get a ping on their own channel. A second webhook is needed
      # because a Discord webhook can only post to the channel it was created in.
      - name: Notify Discord (alpha testers)
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_ALPHA_WEBHOOK }}
          FALLBACK: ${{ secrets.DISCORD_STABLE_WEBHOOK }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            if [ -z "$FALLBACK" ]; then
              echo "No Discord webhook configured; skipping the alpha announcement."
              exit 0
            fi
            echo "DISCORD_ALPHA_WEBHOOK is not set; using the stable webhook."
            WEBHOOK="$FALLBACK"
          fi
          body=$(jq -n --arg tag "$TAG"             '{username: "BuffStrap", content: ("<@&1575803182431342686> **New alpha version available: " + $tag + "**\nHead to https://buff.is-cool.dev/alpha/"), allowed_mentions: {roles: ["1575803182431342686"]}}')
          curl -sS -f -H "Content-Type: application/json" -d "$body" "$WEBHOOK"
